name: Build and Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.414
      - run: dotnet test PersonalAssetPassport.sln --configuration Release --logger trx --results-directory artifacts/backend-tests
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: backend-test-results
          path: artifacts/backend-tests
          retention-days: 14
  android:
    name: Android APK and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - working-directory: android
        run: chmod +x gradlew
      - working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: personal-asset-passport-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
